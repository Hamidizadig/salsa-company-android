name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint and builds
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SalsaCompany-installable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Play bundle candidate
        uses: actions/upload-artifact@v4
        with:
          name: SalsaCompany-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
